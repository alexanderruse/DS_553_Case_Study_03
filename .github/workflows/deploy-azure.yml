name: Deploy API product to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [main, case-study-4]
    paths:
      - app.py
      - src/**
      - requirements-cloud.txt
      - Dockerfile.cloud
      - .github/workflows/deploy-azure.yml

permissions:
  contents: read

concurrency:
  group: azure-container-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-22.04
    environment: case-study-4-azure
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cloud.txt pytest

      - name: Run tests
        env:
          PRODUCT_MODE: api
        run: python -m pytest -q

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy API product
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile.cloud
          acrName: ${{ vars.AZURE_ACR_NAME }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/resumelens-api:${{ github.sha }}
          ingress: external
          targetPort: 8080

      - name: Verify public application
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          fqdn=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          curl --fail --show-error --silent --retry 12 --retry-delay 10 "https://${fqdn}/" >/dev/null
          printf 'Verified https://%s/\n' "$fqdn"
